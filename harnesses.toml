# The harness pins: the versions of the first install (docs/CONVENTIONS.md,
# docs/getting-started.md §7).
#
# The image installs no harness. These readers take their values from here:
#
# - the first install: the image copies this file to
#   /etc/terrarium/harnesses.toml, and `terrariumd harness install` (the
#   entrypoint, and the daemon at each start) installs each pin that is
#   missing from the tools dir (./tools, /opt/terrarium/tools in the
#   container). A harness that is there stays at its version.
# - the Node image: [node] image is the NODE_IMAGE default in
#   docker/Dockerfile; `just ci::check` fails when they differ
#   (scripts/harness-versions.py check).
# - the adapters: crates/terrarium-core/build.rs turns this file into
#   `terrarium_core::harnesses`, and each adapter's `flags.rs` takes
#   `verified` (the pin) from there.
#
# Terrarium does not keep a range of supported versions: the harnesses
# release too often. Any installed version can start an agent. The
# compatibility suite (`just ci::compat`, docs/compat-suite.md) is the way
# to test a new version.
#
# `just harness::update <name> [version]` updates the harness in place in
# the running container (no image build). Add --pin to also write the new
# version here and a row in docs/compat.md "Version history", so a fresh
# install gets it. To roll back, run
# `just harness::update <name> <old version>`.
#
# Keys of a [harness.<name>] table:
#   package  the npm package
#   version  the pinned version, of the first install
#   binary   the command on PATH

[node]
# The base image of the dashboard and runtime stages. pi needs Node >= 22.19,
# Claude Code >= 22, copilot-custom-system-prompt >= 20.19 or >= 22.12.
image = "node:22.23.4-trixie-slim"

[harness.claude]
package = "@anthropic-ai/claude-code"
version = "2.1.310"
binary = "claude"

[harness.codex]
package = "@openai/codex"
version = "0.164.0"
binary = "codex"

[harness.copilot]
package = "@github/copilot"
version = "1.0.103"
binary = "copilot"

[harness.pi]
# pi moved from @mariozechner/pi-coding-agent (last 0.73.1) to this package.
package = "@earendil-works/pi-coding-agent"
version = "1.4.0"
binary = "pi"

# npm packages that are not harnesses. `for` names the harness that uses it.
[extension.copilot-prompt]
# The Copilot system-prompt extension. `terrariumd harness install`
# reinstalls it into the Copilot home when its version or the Copilot
# version in the tools dir changes (crates/terrariumd/src/harness_tools.rs).
package = "copilot-custom-system-prompt"
version = "0.1.2"
binary = "copilot-custom-system-prompt"
for = "copilot"
