[workspace]
resolver = "2"
members = [
    "crates/terrarium-winapi",
    "crates/terrarium-front",
    "crates/terrarium-core",
    "crates/terrariumd",
    "crates/terrarium",
    "crates/terrarium-host",
    "crates/terrarium-sys",
    "crates/terrarium-runner",
    "crates/terrarium-compat",
    "crates/terrarium-version",
    "crates/terrarium-updater",
    "crates/adapters/claude",
    "crates/adapters/codex",
    "crates/adapters/copilot",
    "crates/adapters/pi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/wiltaylor/terrarium"

[workspace.dependencies]
# Internal crates
terrarium-core = { path = "crates/terrarium-core" }
terrarium-runner = { path = "crates/terrarium-runner" }
# The build version of the binaries (`<version>+<git ref>`); only bins use it.
terrarium-version = { path = "crates/terrarium-version" }
# The updater protocol and client (the daemon); the updater bin (feature `bin`).
terrarium-updater = { path = "crates/terrarium-updater", default-features = false }
terrarium-adapter-claude = { path = "crates/adapters/claude" }
terrarium-adapter-codex = { path = "crates/adapters/codex" }
terrarium-adapter-copilot = { path = "crates/adapters/copilot" }
terrarium-adapter-pi = { path = "crates/adapters/pi" }

# Runtime and HTTP
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
http-body-util = "0.1.3"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.29"
# Provider usage probes (PLAN §16.2): HTTPS with rustls and bundled roots.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

# Data
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
ulid = { version = "1.2", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
semver = { version = "1.0.26", features = ["serde"] }
# Schedules (docs/api.md §19): cron expressions and IANA zones. Pinned:
# the cron crate's day-of-week numbering is part of the expression contract.
cron = "=0.17.0"
chrono-tz = "=0.10.4"

# Agent templates as WCL files in the config repo (PLAN §5b). Wil's
# Configuration Language, from GitHub as in his other projects: Cargo.lock
# pins the commit; `cargo update -p wcl_lang` moves it to the newest main.
wcl_lang = { git = "https://github.com/wiltaylor/wcl.git", branch = "main" }
# The positions of a WCL error (its labels). The version of wcl_lang.
miette = { version = "7.6", default-features = false }
# The script step of the board rules (TER-173): the wscript bytecode VM
# (Configweave/wscript), pinned to its release tag. No default features:
# the stdlib (fs, process, json) is not even compiled in.
wscript = { git = "https://github.com/Configweave/wscript.git", tag = "v0.3.0", default-features = false }

# CLI, logging, errors
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.12"
anyhow = "1.0.98"

# Terminals and assets
portable-pty = "0.9"
vt100 = "0.16"
regex = "1.11"
rust-embed = "8.7"
mime_guess = "2.0.5"

# Artifacts, wiki diffs
sha2 = "0.11"
hmac = "0.13"
# The host of a webhook URL (`terrariumd::webhooks::net`); reqwest's own URL type.
url = "2.5"
base64 = "0.22"
tar = { version = "0.4.46", default-features = false }
# Backups (`terrariumd backup`, docs/api.md §32): the zip archive, deflate
# through flate2 (zlib-rs) above. No zip AES: a passphrase seals the entries
# with XChaCha20-Poly1305 and Argon2id, as the secret store does.
zip = { version = "=9.3.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Target displays (PLAN §19b): crop and scale screenshots in the host agent.
png = "0.17"
similar = "2.7"
# Test runs (docs/api.md, test runs): the JUnit and TRX parsers. A DOM
# parser with no DTD support: a DOCTYPE is an error, so no entity expands.
roxmltree = "=0.21.1"
# The repo browser (PLAN §9a): the blob IDs of work tree files, made in
# Rust, so that no git filter runs.
sha1 = "0.11"
# The operator password (docs/api.md §1.1): an Argon2id PHC hash.
argon2 = "0.6"
# The secret store (PLAN §16b): XChaCha20-Poly1305 at rest, zeroizing
# buffers for the plain values, and the SSH key parser that derives the
# public key (OpenSSH, and PEM through rsa, ed25519-dalek, and p256). The
# RustCrypto RC stack that picky (IronRDP) pins already: ssh-key rc.10 fits
# it (rc.11 does not), so the tree holds one crypto stack.
chacha20poly1305 = "0.11"
zeroize = { version = "1.9", features = ["std"] }
ssh-key = { version = "=0.7.0-rc.10", features = ["std", "ed25519", "rsa", "p256", "p384", "p521", "encryption"] }
signature = "3"
# The redaction matcher (PLAN §16b.6).
aho-corasick = "1.1.5"
rsa = { version = "=0.10.0-rc.18", default-features = false, features = ["std", "encoding"] }
ed25519-dalek = { version = "=3.0.0-rc.1", default-features = false, features = ["pkcs8", "pem", "zeroize"] }
p256 = { version = "=0.14.0-rc.14", default-features = false, features = ["pem", "std", "arithmetic"] }
# Password prompts with no echo (`terrariumd password set`, `terrarium login`).
rpassword = "7.5"

# Host agent: TLS without OpenSSL (ring provider, static-musl friendly),
# process groups and signals
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
nix = { version = "0.30", features = ["signal", "process", "hostname", "fs", "user", "dir", "resource"] }
# The seccomp filter of the rule script child (TER-545): a BPF program from
# safe Rust (the workspace forbids `unsafe`).
seccompiler = { version = "0.5", default-features = false }
# TLS on the host agent link (docs/host-protocol.md "TLS"): the daemon's
# rustls listener, the host agent's probe, and self-signed certificates.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = "0.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
# Target displays, step 2 (PLAN §19b): the VNC client (DES for VNC
# authentication, zlib for ZRLE) and the RDP client (IronRDP, with TLS
# from tokio-rustls on ring above: no OpenSSL, so the static musl host
# agent builds). Exact pins: IronRDP moves fast and its crates move
# together. Cargo.lock holds crypto-bigint 0.7.10 and ctutils 0.4.6 (from
# picky), less than two weeks old on 2026-10-27: crypto-bigint 0.7.0 to
# 0.7.8 are yanked for RUSTSEC-2026-0387 (timing leaks).
des = "=0.9.0"
flate2 = "=1.1.10"
ironrdp = { version = "=0.17.0", default-features = false, features = ["connector", "session", "graphics", "input", "pdu", "core"] }
ironrdp-tokio = { version = "=0.10.0", default-features = false }

# Tests
tempfile = "3.20"
# Key generation in the ssh-agent tests (rand_core 0.10, as ssh-key 0.7).
rand = "0.10"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
