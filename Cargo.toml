[workspace]
resolver = "2"
members = [
    "crates/terrarium-core",
    "crates/terrariumd",
    "crates/terrarium",
    "crates/terrarium-host",
    "crates/adapters/claude",
    "crates/adapters/codex",
    "crates/adapters/copilot",
    "crates/adapters/pi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/wiltaylor/terrarium"

[workspace.dependencies]
# Internal crates
terrarium-core = { path = "crates/terrarium-core" }
terrarium-adapter-claude = { path = "crates/adapters/claude" }
terrarium-adapter-codex = { path = "crates/adapters/codex" }
terrarium-adapter-copilot = { path = "crates/adapters/copilot" }
terrarium-adapter-pi = { path = "crates/adapters/pi" }

# Runtime and HTTP
tokio = { version = "1.47", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
hyper = { version = "1.6", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
http-body-util = "0.1.3"

# Data
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
toml = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
ulid = { version = "1.2", features = ["serde"] }
chrono = { version = "0.4.41", features = ["serde"] }
semver = { version = "1.0.26", features = ["serde"] }

# CLI, logging, errors
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
thiserror = "2.0.12"
anyhow = "1.0.98"

# Terminals and assets
portable-pty = "0.9"
vt100 = "0.16"
rust-embed = "8.7"
mime_guess = "2.0.5"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
