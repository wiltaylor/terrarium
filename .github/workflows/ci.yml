name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]

# Least privilege: each job reads the repo only, unless it says more.
# Every action is pinned to a full commit SHA; the comment names the version.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A debug build of the workspace and its test binaries fills the runner's
  # disk: no debug info and no incremental state in CI.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # The merge bar: `just ci::check` (fmt, clippy, the Rust tests, the
  # scripts/ tests, and the dashboard check), one part per step.
  check:
    name: fmt + lint + test
    # Skipped only for a push to main whose head commit carries a
    # `tested-at-cut:` trailer: the lead ran the same full suite on that
    # commit at the version cut (operator, 2026-11-11, question
    # 01M74RFDZ39SP9E3258VM6F48A). Pull requests and every other push run it.
    if: >-
      !(github.event_name == 'push' && github.ref == 'refs/heads/main'
        && contains(github.event.head_commit.message, 'tested-at-cut:'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's preinstalled SDKs take most of its disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      # The sandbox and git tests drive bwrap and git, as the image does.
      - name: Install runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap git
      # Pinned to the Dockerfile's RUST_IMAGE (rust:1.97): a newer clippy
      # adds lints that the local gate does not have.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: taiki-e/install-action@0b43677d266e02f8bd34a2096b57e23a01a92aff # just
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      # harnesses.toml [node] pins the image's Node; the dashboard needs 22.19+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: just ci::fmt-check
      - run: just ci::lint
      # libtest writes no annotations, and the job log needs a token. On a
      # failure, one ::error annotation for each failed test makes the
      # names public (check-runs/<job id>/annotations). The exit code stays.
      - name: just ci::test
        run: |
          set -o pipefail
          rc=0
          just ci::test 2>&1 | tee "$RUNNER_TEMP/cargo-test.log" || rc=$?
          if [ "$rc" -ne 0 ]; then
            python3 scripts/annotate_test_failures.py "$RUNNER_TEMP/cargo-test.log" || true
          fi
          exit "$rc"
      - run: just ci::scripts-test
      - run: just ci::dashboard-check
      # A real protocol-1 executable, including TER-260 hold/replay. Keep this
      # pinned until the supported N-1 boundary changes. A protocol break must
      # bump io.terrarium.runner-compat-epoch in docker/Dockerfile.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: f23f285ab6950c6434c40a7811844a248b4a6c92
          path: .compat/runner-n-1
      - name: Old runner against current daemon, commit and rollback
        run: |
          cargo build --locked --manifest-path .compat/runner-n-1/Cargo.toml -p terrarium-runner --target-dir target/runner-n-1
          cargo build --locked -p terrarium
          TERRARIUM_TEST_OLD_RUNNER="$PWD/target/runner-n-1/debug/terrarium-runner" cargo test -p terrariumd --test it runner_process::agent_rpc_

  # ── Version ───────────────────────────────────────────────────────────────
  # Trailer-gated: a release only happens when HEAD carries a publish trailer.
  #   pre-release: true   → X.Y.Z-alpha, marked as a GitHub pre-release
  #   release: true       → X.Y.Z stable
  # Neither → CI runs tests only. The version is bumped from the last v* tag,
  # scanning conventional-commit subjects since that tag for the bump level
  # (0.x semantics: a breaking change bumps the minor, not the major).
  # A `bump: major|minor|patch` trailer on HEAD overrides the scan (the
  # history before 2026-10-27 uses `area: ...` subjects, which scan as patch).
  # A `release: true` on top of the last tag vX.Y.Z-alpha promotes it: the
  # version is X.Y.Z with no bump, unless a bump trailer is set or vX.Y.Z exists.
  version:
    name: Calculate version
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.calc.outputs.version }}
      prerelease: ${{ steps.calc.outputs.prerelease }}
      do_release: ${{ steps.calc.outputs.do_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: calc
        run: |
          IS_RELEASE=$(git log -1 --format='%(trailers:key=release,valueonly)')
          IS_PRERELEASE=$(git log -1 --format='%(trailers:key=pre-release,valueonly)')
          BUMP_TRAILER=$(git log -1 --format='%(trailers:key=bump,valueonly)' | tr -d '[:space:]')

          if [[ "$IS_RELEASE" != "true" && "$IS_PRERELEASE" != "true" ]]; then
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            echo "No release/pre-release trailer on HEAD — tests only." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          LAST_TAG=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || echo "")
          PROMOTE=false
          if [[ -z "$LAST_TAG" ]]; then
            PREV_MAJOR=0; PREV_MINOR=0; PREV_PATCH=0; RANGE="HEAD"
          else
            VER="${LAST_TAG#v}"; VER="${VER%%-*}"
            IFS='.' read -r PREV_MAJOR PREV_MINOR PREV_PATCH <<< "$VER"
            RANGE="${LAST_TAG}..HEAD"
            # A release on top of vX.Y.Z-alpha promotes it (no bump), unless a
            # bump trailer asks for one or vX.Y.Z already exists.
            if [[ "$IS_RELEASE" == "true" && "$IS_PRERELEASE" != "true" && "$LAST_TAG" == *-alpha \
                  && -z "$BUMP_TRAILER" && -z "$(git tag --list "v$VER")" ]]; then
              PROMOTE=true
            fi
          fi

          BUMP="none"
          while IFS= read -r HASH; do
            SUBJECT=$(git log -1 --format='%s' "$HASH")
            BODY=$(git log -1 --format='%b' "$HASH")
            if echo "$SUBJECT" | grep -qE '^[a-z]+(\(.+\))?!:' || echo "$BODY" | grep -qiE '^BREAKING[ -]CHANGE:'; then
              BUMP="major"
            elif echo "$SUBJECT" | grep -qE '^feat(\(.+\))?:' && [[ "$BUMP" != "major" ]]; then
              BUMP="minor"
            elif echo "$SUBJECT" | grep -qE '^(fix|perf|refactor|build|ci|docs|style|test|chore|revert)(\(.+\))?:' && [[ "$BUMP" == "none" ]]; then
              BUMP="patch"
            fi
          done < <(git log --format='%H' $RANGE)
          [[ "$BUMP" == "none" ]] && BUMP="patch"
          case "$BUMP_TRAILER" in
            major|minor|patch) BUMP="$BUMP_TRAILER" ;;
            "") ;;
            *) echo "::error::bump trailer must be major, minor, or patch (got '$BUMP_TRAILER')"; exit 1 ;;
          esac

          case "$BUMP" in
            major)
              if [[ "$PREV_MAJOR" -eq 0 ]]; then MAJOR=0; MINOR=$((PREV_MINOR + 1)); PATCH=0
              else MAJOR=$((PREV_MAJOR + 1)); MINOR=0; PATCH=0; fi ;;
            minor) MAJOR=$PREV_MAJOR; MINOR=$((PREV_MINOR + 1)); PATCH=0 ;;
            patch) MAJOR=$PREV_MAJOR; MINOR=$PREV_MINOR; PATCH=$((PREV_PATCH + 1)) ;;
          esac

          VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PRERELEASE=false
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            VERSION="${VERSION}-alpha"
            PRERELEASE=true
          fi
          if [[ "$PROMOTE" == "true" ]]; then
            VERSION="$VER"
            BUMP="promoted from $LAST_TAG"
          fi

          echo "Calculated version: $VERSION (bump=$BUMP, prerelease=$PRERELEASE, from ${LAST_TAG:-none})"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## Release

          | | |
          |---|---|
          | **Version** | \`$VERSION\` |
          | **Bump** | $BUMP |
          | **Pre-release** | $PRERELEASE |
          | **Previous tag** | \`${LAST_TAG:-none}\` |
          SUMMARY

  # ── Image ─────────────────────────────────────────────────────────────────
  # The release image ghcr.io/<owner>/terrarium:<version>, plus `:latest`
  # (stable) or `:pre` (pre-release): the runtime stage of docker/Dockerfile,
  # with the OCI labels, a BuildKit SBOM and provenance, and a GitHub build
  # provenance attestation (Sigstore, keyless) for the image digest.
  #
  # The host agent asset of the release comes OUT of the pushed image
  # (/opt/terrarium/dist), so the release binary and the binary that the
  # daemon serves to host agents (GET /install/terrarium-host, self-update)
  # are the same bytes. The host helper asset (terrarium-host-helper, native
  # GPU enforcement) comes out of the same directory. SHA256SUMS covers
  # both, and both are attested too.
  # docs/release.md says how to verify both.
  image:
    name: Build and push the image
    needs: [version, check]
    # A check skipped by the tested-at-cut trailer does not stop the image;
    # a failed or cancelled check does.
    if: >-
      always() && needs.version.outputs.do_release == 'true'
      && needs.version.result == 'success'
      && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # the Sigstore certificate of the attestations
      attestations: write # store the attestations on GitHub
    outputs:
      image: ${{ steps.names.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The runner's preinstalled SDKs take most of its disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (2026-11)
        with:
          toolchain: 1.97.1
      - name: Stamp version
        run: ./.github/stamp-version.sh "$VERSION"
      - name: Image name and tags
        id: names
        run: |
          # GHCR names are lower case.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$PRERELEASE" == "true" ]]; then channel=pre; else channel=latest; fi
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            echo "$image:$channel"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.names.outputs.tags }}
          # `--version` of every binary: <version>+<commit> (crates/terrarium-version).
          # The commit, not scripts/build-ref.sh: the stamp step leaves a dirty tree.
          build-args: |
            TERRARIUM_GIT_REF=${{ github.sha }}
            TERRARIUM_VERSION=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.names.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Take the host agent and the host helper out of the image
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          docker pull --platform linux/amd64 "$ref"
          cid=$(docker create --platform linux/amd64 "$ref")
          : > SHA256SUMS
          # terrarium-host-helper: the root helper of native GPU enforcement
          # (docs/native-gpu-helper.md), built with terrarium-host.
          for bin in terrarium-host terrarium-host-helper; do
            docker cp "$cid:/opt/terrarium/dist/$bin-x86_64-linux" "$bin.bin"
            docker cp "$cid:/opt/terrarium/dist/$bin-x86_64-linux.sha256" "$bin.sha256"
            # The hash in the image (the daemon serves it for terrarium-host) must be the hash of the asset.
            want=$(cut -d' ' -f1 "$bin.sha256")
            got=$(sha256sum "$bin.bin" | cut -d' ' -f1)
            [[ "$want" == "$got" ]] || { echo "::error::the image's $bin is $got, its .sha256 says $want"; exit 1; }
            asset="$bin-$VERSION-linux-x86_64"
            mv "$bin.bin" "$asset"
            rm "$bin.sha256"
            chmod 0755 "$asset"
            sha256sum "$asset" >> SHA256SUMS
            # The binary in the image reports the release version.
            "./$asset" --version | tee /dev/stderr | grep -q "^$bin $VERSION+"
          done
          docker rm "$cid"
          cat SHA256SUMS
          [[ $(wc -l < SHA256SUMS) == 2 ]] || { echo "::error::SHA256SUMS must list the host agent and the host helper"; exit 1; }
      - name: Attest the host agent and the host helper
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The glob matches terrarium-host-<v>-... and terrarium-host-helper-<v>-...
          subject-path: terrarium-host-*-linux-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-host
          path: |
            terrarium-host-*-linux-x86_64
            SHA256SUMS
          retention-days: 1

  # ── Release ───────────────────────────────────────────────────────────────
  # Tag the commit and cut a GitHub (pre-)release with the host agent, the
  # host helper, and SHA256SUMS. The notes name the image and its digest.
  release:
    name: Create GitHub release
    needs: [version, image]
    if: needs.version.outputs.do_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ${{ needs.image.outputs.image }}
      DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: bin-*
          merge-multiple: true
      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"
      - name: Release notes
        run: |
          cat > notes.md <<NOTES
          ## Image

          \`$IMAGE:$VERSION\` (digest \`$DIGEST\`)

          Verify it (docs/release.md):

          \`\`\`sh
          gh attestation verify oci://$IMAGE:$VERSION --repo $GITHUB_REPOSITORY
          gh attestation verify terrarium-host-$VERSION-linux-x86_64 --repo $GITHUB_REPOSITORY
          gh attestation verify terrarium-host-helper-$VERSION-linux-x86_64 --repo $GITHUB_REPOSITORY
          sha256sum -c SHA256SUMS
          \`\`\`
          NOTES
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
