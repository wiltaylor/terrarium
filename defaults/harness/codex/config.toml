# Codex settings for every Terrarium agent on Codex (PLAN §8.2).
#
# The daemon reads this file at each agent start and gives each key to
# Codex as a `-c key=value` override, on top of the shared
# $CODEX_HOME/config.toml. A per-agent option (the agent's `model`) and the
# keys that Terrarium forces win over this file. Terrarium drops the
# forced keys from this file:
#
# - the yolo flags, `hooks`, `projects` (the workspace trust),
#   `sqlite_home`, `tui.resume_cwd`, `check_for_update_on_startup`,
#   `analytics`, `feedback`, `sandbox_mode`, `approval_policy`,
#   `model_instructions_file`, `developer_instructions`;
# - the ask-user tools and the plan text (`tools.experimental_request_user_input`,
#   `features.default_mode_request_user_input`,
#   `include_collaboration_mode_instructions`, `tools.update_plan`),
#   `features.goals`, the start-up notices (`notice.*`, `tui.show_tooltips`),
#   apps, plugins, tool suggestions, MCP install prompts, memories, the
#   app-server daemon, and `features.hooks`;
# - the sub-agent tools (`agents.enabled`, `features.multi_agent`,
#   `features.multi_agent_v2`), the `sleep` tool (`features.sleep_tool`),
#   and background terminals (`features.unified_exec`: a managed
#   requirements file in the sandbox pins it off);
# - the skills (`skills.bundled`, `skills.include_instructions`): only
#   Terrarium-managed skills load (PLAN §8.6).
#
# docs/compat.md ("Harness hardening") lists them with the reason.
#
# A file that does not parse stops the agent start with the line number.
# The keys below are defaults: change them here.

# Web search. "cached" or "live" allows it.
web_search = "disabled"

[features]
# The `image_gen.imagegen` tool. It needs a ChatGPT plan login (not Free,
# not an API key). Each agent's images go to `generated_images/` in its
# workspace.
image_generation = true
# Shadow-mode metrics only.
skill_search = false

[tui]
notifications = false

[otel]
metrics_exporter = "none"
