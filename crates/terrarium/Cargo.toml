[package]
name = "terrarium"
description = "The Terrarium CLI, for the operator and for agents"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "terrarium"
path = "src/main.rs"

[dependencies]
terrarium-core.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
base64.workspace = true
sha2.workspace = true
chrono.workspace = true
rpassword.workspace = true
# The values of `exec-env` (the harness credentials) are zeroed on drop.
zeroize.workspace = true
# HTTPS to the daemon (`TERRARIUM_URL=https://...`): rustls with the system
# roots, and a CA file of your own (`TERRARIUM_CA_FILE`).
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true

[dev-dependencies]
axum.workspace = true
ulid.workspace = true
tempfile.workspace = true
# A self-signed certificate for the HTTPS test.
rcgen.workspace = true

[lints]
workspace = true
