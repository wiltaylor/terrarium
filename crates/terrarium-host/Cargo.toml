[package]
name = "terrarium-host"
description = "The Terrarium host agent: runs commands, Docker, and vmlab for the daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "terrarium_host"
path = "src/lib.rs"

[[bin]]
name = "terrarium-host"
path = "src/main.rs"

[dependencies]
terrarium-core.workspace = true
terrarium-sys = { path = "../terrarium-sys" }
terrarium-version.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tokio.workspace = true
futures-util.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-native-roots"] }
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
rustls-native-certs.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
portable-pty.workspace = true
sha2.workspace = true
nix.workspace = true
rustix = { version = "=1.1.5", features = ["mount", "fs"] }
tempfile.workspace = true
png.workspace = true
base64.workspace = true
des.workspace = true
flate2.workspace = true
ironrdp.workspace = true
ironrdp-tokio.workspace = true

[dev-dependencies]

[lints]
workspace = true
