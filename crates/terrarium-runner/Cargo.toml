[package]
name = "terrarium-runner"
description = "The Terrarium agent runner: the PTY, the status machine, the runner socket, and the runner process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["bin"]
# The `terrarium-runner` binary: the adapter selection, the CLI, and the
# log setup. A library user (the daemon) can turn it off with
# `default-features = false` and skip the four adapter crates.
bin = [
    "dep:terrarium-adapter-claude",
    "dep:terrarium-adapter-codex",
    "dep:terrarium-adapter-copilot",
    "dep:terrarium-adapter-pi",
    "dep:clap",
    "dep:anyhow",
    "dep:tracing-subscriber",
    "dep:semver",
]
# `test_support`: the guard that ends the runner processes of a test, and
# the sweep of stale runners. For the tests of this crate and the daemon.
test-support = []

[[bin]]
name = "terrarium-runner"
path = "src/bin/terrarium-runner/main.rs"
required-features = ["bin"]

[[test]]
name = "process"
path = "tests/process.rs"
# It runs the binary.
required-features = ["bin"]

[[test]]
name = "runner"
path = "tests/runner.rs"

[dependencies]
terrarium-core.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
portable-pty.workspace = true
vt100.workspace = true
regex.workspace = true
base64.workspace = true
nix.workspace = true
# The runner process (`src/bin`, feature `bin`): the adapters map hooks,
# read the screen, and give the keys. The daemon builds the launch spec
# itself.
terrarium-adapter-claude = { workspace = true, optional = true }
terrarium-adapter-codex = { workspace = true, optional = true }
terrarium-adapter-copilot = { workspace = true, optional = true }
terrarium-adapter-pi = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
semver = { workspace = true, optional = true }

[dev-dependencies]
# The tests use `test_support`.
terrarium-runner = { path = ".", features = ["test-support"] }
tempfile.workspace = true
semver.workspace = true

[lints]
workspace = true
