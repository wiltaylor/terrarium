[package]
name = "terrarium-winapi"
description = "Audited Windows process containment boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Operator-approved exception. Do not inherit the workspace unsafe forbid.
[lints.rust]
unsafe_code = "allow"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Environment", "Win32_System_GroupPolicy", "Win32_UI_Shell", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO"] }
