[package]
name = "terrarium-core"
description = "Terrarium domain model, events, adapter trait, and executor protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ulid.workspace = true
chrono.workspace = true
semver.workspace = true
thiserror.workspace = true
tracing.workspace = true
vt100.workspace = true
# The secret scan of the config repo (`secret_scan`).
regex.workspace = true
# The redaction matcher (`redact`, PLAN §16b.6).
aho-corasick.workspace = true
# The hash of an agent's delivered skills (`skills`).
sha2.workspace = true
# Agent template files (`template_file`, feature `wcl`). Off for the
# host agent: it has no templates, and its static musl build stays small.
wcl_lang = { workspace = true, optional = true }
miette = { workspace = true, optional = true }

[features]
wcl = ["dep:wcl_lang", "dep:miette"]

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
serde.workspace = true
toml.workspace = true
semver.workspace = true

[lints]
workspace = true
