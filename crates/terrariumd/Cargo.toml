[package]
name = "terrariumd"
description = "The Terrarium daemon: API, supervisor, and embedded dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Build `supervisor::InMemorySupervisor`, the fake for the integration tests.
fake-supervisor = []

[dependencies]
terrarium-core.workspace = true
terrarium-runner.workspace = true
terrarium-adapter-claude.workspace = true
terrarium-adapter-codex.workspace = true
terrarium-adapter-copilot.workspace = true
terrarium-adapter-pi.workspace = true
# The host agent wire protocol (docs/host-protocol.md); lib + bin crate.
terrarium-host = { path = "../terrarium-host" }
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
chrono.workspace = true
ulid.workspace = true
futures-util.workspace = true
regex.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
tar.workspace = true
similar.workspace = true
toml.workspace = true
reqwest.workspace = true
semver.workspace = true
# The TLS host listener (TERRARIUM_HOST_TLS_CERT, docs/host-protocol.md).
rustls.workspace = true
tokio-rustls.workspace = true

[dev-dependencies]
# The integration tests use the fake supervisor.
terrariumd = { path = ".", features = ["fake-supervisor"] }
# The guard that ends the runner processes of a test.
terrarium-runner = { workspace = true, features = ["test-support"] }
semver.workspace = true
toml.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
