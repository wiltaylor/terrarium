[package]
name = "terrariumd"
description = "The Terrarium daemon: API, supervisor, and embedded dashboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Build `supervisor::InMemorySupervisor`, the fake for the integration tests.
fake-supervisor = []

[dependencies]
terrarium-core.workspace = true
terrarium-runner.workspace = true
terrarium-adapter-claude.workspace = true
tower = { workspace = true, features = ["util"] }
http-body-util.workspace = true
tokio.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rust-embed.workspace = true
mime_guess.workspace = true
chrono.workspace = true
ulid.workspace = true
futures-util.workspace = true
regex.workspace = true
sha2.workspace = true
hmac.workspace = true
base64.workspace = true
tar.workspace = true
similar.workspace = true
toml.workspace = true

[dev-dependencies]
# The integration tests use the fake supervisor.
terrariumd = { path = ".", features = ["fake-supervisor"] }
semver.workspace = true
toml.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio-tungstenite.workspace = true
tempfile.workspace = true

[lints]
workspace = true
